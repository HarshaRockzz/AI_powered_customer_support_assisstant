# Render.com Blueprint for AI Customer Support Assistant
# This file defines all services needed for deployment

databases:
  # Managed PostgreSQL (Render native, not the Dockerfile.postgres pserv --
  # exposes a single connectionString, which is what the Go backend expects
  # via POSTGRES_URL below. The Go backend auto-migrates its own schema.)
  - name: ai-support-postgres
    databaseName: ai_support_db
    user: ai_support

services:
  # Redis Cache
  - type: pserv
    name: ai-support-redis
    env: docker
    dockerfilePath: ./Dockerfile.redis
    disk:
      name: redis-data
      mountPath: /data
      sizeGB: 1

  # Python RAG Service
  # Uses Qdrant Cloud (external) rather than a self-hosted pserv instance, since
  # the security_knowledge_base collection already lives there.
  - type: web
    name: ai-support-rag
    env: docker
    dockerfilePath: ./Dockerfile.rag
    dockerContext: ./
    envVars:
      - key: LLM_PROVIDER
        value: openrouter
      - key: EMBEDDING_PROVIDER
        value: openrouter
      - key: OPENROUTER_API_KEY
        sync: false
      - key: OPENROUTER_MODEL
        value: openai/gpt-oss-20b:free
      - key: OPENROUTER_EMBEDDING_MODEL
        value: nvidia/llama-nemotron-embed-vl-1b-v2:free
      - key: VECTOR_DB
        value: qdrant
      - key: QDRANT_URL
        sync: false
      - key: QDRANT_API_KEY
        sync: false
      - key: QDRANT_COLLECTION_NAME
        value: security_knowledge_base
      - key: QDRANT_CONTENT_PAYLOAD_KEY
        value: text
      - key: RAG_SERVICE_PORT
        value: 8000

  # Go Backend API
  - type: web
    name: ai-support-backend
    env: docker
    dockerfilePath: ./Dockerfile.backend
    dockerContext: ./
    envVars:
      - key: BACKEND_PORT
        value: 8080
      - key: GO_ENV
        value: production
      - key: RAG_SERVICE_URL
        fromService:
          type: web
          name: ai-support-rag
          property: host
      - key: POSTGRES_URL
        fromDatabase:
          name: ai-support-postgres
          property: connectionString
      - key: REDIS_HOST
        fromService:
          type: pserv
          name: ai-support-redis
          property: host
      - key: REDIS_PORT
        value: 6379
      - key: JWT_SECRET
        generateValue: true

  # Next.js Dashboard
  - type: web
    name: ai-support-dashboard
    env: docker
    dockerfilePath: ./Dockerfile.dashboard
    dockerContext: ./
    envVars:
      - key: NEXT_PUBLIC_BACKEND_URL
        fromService:
          type: web
          name: ai-support-backend
          property: host
      - key: PORT
        value: 3000

